<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password – ServiceHub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/static/css/theme.css">
<script src="/static/js/theme.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-family);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
    padding: 2rem 1rem;
    transition: var(--transition);
  }
  .header-actions {
    position: absolute;
    top: 2rem;
    right: 2rem;
    z-index: 100;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-xl);
    padding: 2.5rem;
    width: 100%;
    max-width: 480px;
    position: relative;
    z-index: 10;
    box-shadow: var(--card-shadow);
  }
  .logo {
    font-size: 1.5rem;
    font-weight: 800;
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    margin-bottom: .5rem;
  }
  .subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: .9rem;
    margin-bottom: 2rem;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 800;
    text-align: center;
    margin-bottom: .25rem;
    color: var(--text-primary);
  }
  .error-box {
    background: var(--danger-light);
    border: 1px solid var(--danger);
    border-radius: var(--radius-sm);
    padding: .75rem 1rem;
    color: var(--danger);
    font-size: .9rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .form-group {
    margin-bottom: 1.25rem;
  }
  label {
    display: block;
    font-size: .85rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: .5rem;
  }
  .input-wrap {
    position: relative;
  }
  .input-wrap i {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    font-size: .9rem;
  }
  input {
    width: 100%;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    padding: .75rem 2.5rem;
    color: var(--text-primary);
    font-size: .95rem;
    font-family: var(--font-family);
    transition: var(--transition);
  }
  input:focus {
    outline: none;
    border-color: var(--primary);
    background: var(--bg-secondary);
  }
  .toggle-pw {
    position: absolute;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    cursor: pointer;
    border: none;
    background: none;
    font-size: .9rem;
  }
  .btn-submit {
    width: 100%;
    background: var(--primary-gradient);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    padding: .9rem;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    margin-top: .5rem;
  }
  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(79, 70, 229, 0.35);
  }
</style>
</head>
<body>

<div class="header-actions">
  <button class="theme-toggle-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
</div>

<div class="card">
  <div class="logo">⚡ ServiceHub</div>
  <h1>Reset Password</h1>
  <div class="subtitle">Set a secure new password for your account <strong>{{ email }}</strong>.</div>

  {% if error %}
  <div class="error-box"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
  {% endif %}

  <form method="POST" action="/forgot-password/reset/">
    {% csrf_token %}

    <div class="form-group">
      <label for="passw">New Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="passw" name="passw" placeholder="At least 6 characters" required minlength="6">
        <button type="button" class="toggle-pw" onclick="togglePw('passw', 'eye1')"><i class="fas fa-eye" id="eye1"></i></button>
      </div>
    </div>

    <div class="form-group">
      <label for="rpass">Confirm Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="rpass" name="rpass" placeholder="Re-enter new password" required minlength="6">
        <button type="button" class="toggle-pw" onclick="togglePw('rpass', 'eye2')"><i class="fas fa-eye" id="eye2"></i></button>
      </div>
    </div>

    <button type="submit" class="btn-submit">
      <i class="fas fa-key"></i> Update Password
    </button>
  </form>
</div>

<script>
  function togglePw(id, eyeId) {
    const p = document.getElementById(id);
    const e = document.getElementById(eyeId);
    if (p.type === 'password') {
      p.type = 'text';
      e.classList.replace('fa-eye','fa-eye-slash');
    } else {
      p.type = 'password';
      e.classList.replace('fa-eye-slash','fa-eye');
    }
  }
</script>
</body>
</html>
