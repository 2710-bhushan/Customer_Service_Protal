<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP – ServiceHub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/static/css/theme.css">
<script src="/static/js/theme.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-family);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
    padding: 2rem 1rem;
    transition: var(--transition);
  }
  .header-actions {
    position: absolute;
    top: 2rem;
    right: 2rem;
    z-index: 100;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-xl);
    padding: 2.5rem;
    width: 100%;
    max-width: 480px;
    position: relative;
    z-index: 10;
    box-shadow: var(--card-shadow);
  }
  .logo {
    font-size: 1.5rem;
    font-weight: 800;
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    margin-bottom: .5rem;
  }
  .subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: .9rem;
    margin-bottom: 2rem;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 800;
    text-align: center;
    margin-bottom: .25rem;
    color: var(--text-primary);
  }
  .error-box {
    background: var(--danger-light);
    border: 1px solid var(--danger);
    border-radius: var(--radius-sm);
    padding: .75rem 1rem;
    color: var(--danger);
    font-size: .9rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .form-group {
    margin-bottom: 1.25rem;
  }
  label {
    display: block;
    font-size: .85rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: .5rem;
  }
  .input-wrap {
    position: relative;
  }
  .input-wrap i {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    font-size: .9rem;
  }
  input {
    width: 100%;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    padding: .75rem 1rem .75rem 2.5rem;
    color: var(--text-primary);
    font-size: 1.1rem;
    font-family: var(--font-family);
    transition: var(--transition);
    text-align: center;
    letter-spacing: .2em;
  }
  input:focus {
    outline: none;
    border-color: var(--primary);
    background: var(--bg-secondary);
  }
  .btn-submit {
    width: 100%;
    background: var(--primary-gradient);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    padding: .9rem;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    margin-top: .5rem;
  }
  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(79, 70, 229, 0.35);
  }
  .back-link {
    text-align: center;
    font-size: .88rem;
    color: var(--text-muted);
    margin-top: 1.25rem;
  }
  .back-link a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="header-actions">
  <button class="theme-toggle-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
</div>

<div class="card">
  <div class="logo">⚡ ServiceHub</div>
  <h1>Verify Security OTP</h1>
  <div class="subtitle">An OTP has been sent to your email <strong>{{ email }}</strong>. Please enter it below.</div>

  {% if error %}
  <div class="error-box"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
  {% endif %}

  <form method="POST" action="/forgot-password/verify/">
    {% csrf_token %}

    <div class="form-group">
      <label for="otp">Enter 6-Digit OTP</label>
      <div class="input-wrap">
        <i class="fas fa-key" style="letter-spacing: normal;"></i>
        <input type="text" id="otp" name="otp" placeholder="XXXXXX" required maxlength="6" autocomplete="one-time-code">
      </div>
    </div>

    <button type="submit" class="btn-submit">
      <i class="fas fa-check-circle"></i> Verify OTP
    </button>
  </form>

  <div class="back-link">
    Didn't get the code? <a href="/forgot-password/">Restart Process</a>
  </div>
</div>

</body>
</html>
