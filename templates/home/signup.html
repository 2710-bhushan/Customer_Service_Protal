<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up – ServiceHub</title>
<meta name="description" content="Create your ServiceHub account. Join as a customer or service provider.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/static/css/theme.css">
<script src="/static/js/theme.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-family);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
    padding: 2rem 1rem;
    transition: var(--transition);
  }
  .header-actions {
    position: absolute;
    top: 2rem;
    right: 2rem;
    z-index: 100;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-xl);
    padding: 2.5rem;
    width: 100%;
    max-width: 480px;
    position: relative;
    z-index: 10;
    box-shadow: var(--card-shadow);
  }
  .logo {
    font-size: 1.5rem;
    font-weight: 800;
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    margin-bottom: .5rem;
  }
  .subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: .9rem;
    margin-bottom: 2rem;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 800;
    text-align: center;
    margin-bottom: .25rem;
    color: var(--text-primary);
  }
  .error-box {
    background: var(--danger-light);
    border: 1px solid var(--danger);
    border-radius: var(--radius-sm);
    padding: .75rem 1rem;
    color: var(--danger);
    font-size: .9rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .form-group {
    margin-bottom: 1.25rem;
  }
  label {
    display: block;
    font-size: .85rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: .5rem;
  }
  .input-wrap {
    position: relative;
  }
  .input-wrap i {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    font-size: .9rem;
  }
  input {
    width: 100%;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    padding: .75rem 1rem .75rem 2.5rem;
    color: var(--text-primary);
    font-size: .95rem;
    font-family: var(--font-family);
    transition: var(--transition);
  }
  input:focus {
    outline: none;
    border-color: var(--primary);
    background: var(--bg-secondary);
  }
  .type-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .75rem;
    margin-bottom: 1.5rem;
  }
  .type-option {
    position: relative;
  }
  .type-option input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }
  .type-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .5rem;
    background: var(--bg-tertiary);
    border: 2px solid var(--border-light);
    border-radius: var(--radius-md);
    padding: 1.25rem;
    cursor: pointer;
    transition: var(--transition);
  }
  .type-label:hover {
    border-color: var(--primary-hover);
  }
  .type-option input:checked + .type-label {
    background: var(--primary-light);
    border-color: var(--primary);
    color: var(--primary);
  }
  .type-label .icon {
    font-size: 1.8rem;
  }
  .type-label .name {
    font-weight: 700;
    font-size: .9rem;
  }
  .type-label .desc {
    font-size: .75rem;
    color: var(--text-muted);
    text-align: center;
  }
  .btn-submit {
    width: 100%;
    background: var(--primary-gradient);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    padding: 1rem;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    margin-top: .5rem;
  }
  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(79, 70, 229, 0.35);
  }
  .divider {
    text-align: center;
    color: var(--text-light);
    font-size: .85rem;
    margin: 1.25rem 0;
    position: relative;
  }
  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 35%;
    height: 1px;
    background: var(--border-light);
  }
  .divider::before { left: 0; }
  .divider::after { right: 0; }
  .signin-link {
    text-align: center;
    font-size: .9rem;
    color: var(--text-muted);
  }
  .signin-link a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
  }
  .strength-bar {
    height: 4px;
    border-radius: 2px;
    margin-top: .4rem;
    transition: var(--transition);
    background: var(--border-light);
  }
  .requirements {
    font-size: .75rem;
    color: var(--text-light);
    margin-top: .3rem;
  }
  
  @media (max-width: 600px) {
    .header-actions { top: 1rem; right: 1rem; }
  }
</style>
</head>
<body>

<div class="header-actions">
  <button class="theme-toggle-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
</div>

<div class="card">
  <div class="logo">⚡ ServiceHub</div>
  <h1>Create Account</h1>
  <p class="subtitle">Join thousands of satisfied customers</p>

  {% if error %}
  <div class="error-box"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
  {% endif %}

  <form method="POST" action="/signup/" id="signupForm">
    {% csrf_token %}

    <div class="form-group">
      <label>Account Type</label>
      <div class="type-selector">
        <div class="type-option">
          <input type="radio" name="account_type" id="type_customer" value="customer" checked>
          <label class="type-label" for="type_customer">
            <span class="icon">👤</span>
            <span class="name">Customer</span>
            <span class="desc">Book home services</span>
          </label>
        </div>
        <div class="type-option">
          <input type="radio" name="account_type" id="type_provider" value="provider">
          <label class="type-label" for="type_provider">
            <span class="icon">🔧</span>
            <span class="name">Provider</span>
            <span class="desc">Offer your services</span>
          </label>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="mail">Email Address</label>
      <div class="input-wrap">
        <i class="fas fa-envelope"></i>
        <input type="email" id="mail" name="mail" placeholder="you@example.com" required autocomplete="email">
      </div>
    </div>

    <div class="form-group">
      <label for="passw">Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="passw" name="passw" placeholder="Minimum 6 characters" required minlength="6" oninput="checkStrength(this.value)">
      </div>
      <div class="strength-bar" id="strengthBar"></div>
      <div class="requirements" id="strengthText">Password strength</div>
    </div>

    <div class="form-group">
      <label for="rpass">Confirm Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="rpass" name="rpass" placeholder="Repeat your password" required oninput="checkMatch()">
      </div>
      <div class="requirements" id="matchText"></div>
    </div>

    <button type="submit" class="btn-submit">
      <i class="fas fa-paper-plane"></i> Send Verification OTP
    </button>
  </form>

  <div class="divider">Already have an account?</div>
  <div class="signin-link"><a href="/signin/">Sign In here</a></div>
</div>

<script>
  function checkStrength(p){
    const bar=document.getElementById('strengthBar');
    const txt=document.getElementById('strengthText');
    let score=0;
    if(p.length>=6)score++;
    if(p.length>=10)score++;
    if(/[A-Z]/.test(p))score++;
    if(/[0-9]/.test(p))score++;
    if(/[^a-zA-Z0-9]/.test(p))score++;
    const colors=['#ef4444','#f59e0b','#eab308','#10b981','#10b981'];
    const labels=['Very Weak','Weak','Fair','Strong','Very Strong'];
    bar.style.background=colors[score-1]||'var(--border-light)';
    bar.style.width=(score*20)+'%';
    txt.textContent=labels[score-1]||'Enter a password';
    txt.style.color=colors[score-1]||'var(--text-light)';
  }
  function checkMatch(){
    const p=document.getElementById('passw').value;
    const r=document.getElementById('rpass').value;
    const txt=document.getElementById('matchText');
    if(r.length>0){
      txt.textContent=p===r?'✓ Passwords match':'✗ Passwords do not match';
      txt.style.color=p===r?'var(--success)':'var(--danger)';
    }
  }
</script>
</body>
</html>
